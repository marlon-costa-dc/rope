[project]
name = 'rope'
description = 'a python refactoring library...'
readme = 'README.rst'
requires-python = '>=3.10'
classifiers = [
    'Development Status :: 4 - Beta',
    'Operating System :: OS Independent',
    'Environment :: X11 Applications',
    'Environment :: Win32 (MS Windows)',
    'Environment :: MacOS X',
    'Intended Audience :: Developers',
    'Natural Language :: English',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: 3.15',
    'Topic :: Software Development',
]
version = '1.15.0+dc.5'
license = 'LGPL-3.0-or-later'
license-files = ['COPYING']
dependencies = ['pytoolconfig[global] >= 1.2.2']

[[project.authors]]
name = 'Ali Gholami Rudi'
email = 'aligrudi@users.sourceforge.net'

[[project.maintainers]]
name = 'Lie Ryan'
email = 'lieryan.24@proton.me'

[project.urls]
Source = 'https://github.com/python-rope/rope'
Documentation = 'https://rope.readthedocs.io/'

[project.optional-dependencies]
doc = [
    'pytoolconfig[doc]',
    "sphinx>=4.5.0",
    "sphinx-autodoc-typehints>=1.18.1",
    "sphinx-rtd-theme>=1.0.0",
]
dev = [
    'pytest>=7.0.1',
    'pytest-cov>=4.1.0',
    'pytest-timeout>=2.1.0',
    'pytest-xdist>=3.8.0',
    'build>=0.7.0',
    'pre-commit>=3.2.0',
]
release = [
    'toml>=0.10.2',
    'twine>=4.0.2',
    'pip-tools>=6.12.1',
]
[tool.setuptools.packages.find]
namespaces = false
exclude = ['ropetest*']

[tool.setuptools.package-data]
rope = ["py.typed"]

[tool.black]
target-version = [
    'py38',
    'py39',
    'py310',
    'py311',
    'py312',
]
include = 'rope/.*\.pyi?$'
force-exclude = 'ropetest|rope/base/prefs.py'

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError()",
]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]

testpaths = "ropetest"
python_files = [
    "*test.py",
    "__init__.py",
]

[build-system]
requires = [
    'setuptools>=77.0.0',
]
build-backend = 'setuptools.build_meta'

[tool.coverage.run]
source = ['rope', 'ropetest']
