name: Upload Python Package

on:
  release:
    types: [published]

jobs:
  verify-fork-release:
    if: contains(github.event.release.tag_name, '+')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.13'
    - name: Set up native artifact validation
      run: |
        python -m pip install uv
        make setup UV="python -m uv"
    - name: Download published fork artifacts
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: >-
        gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
        --pattern '*.whl' --pattern '*.tar.gz' --dir dist
    - name: Validate published wheel and source distribution
      run: make artifact-check

  deploy:
    if: ${{ !contains(github.event.release.tag_name, '+') }}
    runs-on: ubuntu-latest
    environment: publishing
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build package
      run: python -m build
    - name: Publish package
      if: startsWith(github.ref, 'refs/tags')
      uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc
