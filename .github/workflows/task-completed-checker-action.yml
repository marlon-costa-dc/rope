name: 'PR Tasks Completed Check'
on:
  pull_request_target:
    types: [opened, edited]

jobs:
  task-check:
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - uses: kentaro-m/task-completed-checker-action@15aa21278f36c35b1006de5c65efa6b04e7b02bf # v0.1.0
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
