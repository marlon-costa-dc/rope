name: Run tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Test - ${{ matrix.python-version }} - ${{matrix.os}}
    runs-on: ${{matrix.os}}
    env:
      CODECOV_GPG_FINGERPRINT: 27034E7FDB850E0BBC2C62FF806BB28AED779869

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15.0-rc.1']
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: 'gha-cache-key.txt'
    - name: Install dependencies
      run: |
        python -m pip install -e .[dev]
    - name: Test with pytest
      run: |
        python -m pytest --cov --cov-report=term --cov-report=xml:coverage.xml -v
    - name: Authenticate Codecov signing key
      shell: bash
      run: |
        set -euo pipefail
        export GNUPGHOME="$RUNNER_TEMP/codecov-gnupg"
        printf 'GNUPGHOME=%s\n' "$GNUPGHOME" >> "$GITHUB_ENV"
        mkdir -m 700 "$GNUPGHOME"
        gpg --dump-options | grep -Fx -- '--assert-signer'
        key="$GNUPGHOME/codecov.asc"
        curl --fail --location --output "$key" https://keybase.io/codecovsecops/pgp_keys.asc
        fingerprint="$(
          gpg --batch --with-colons --show-keys "$key" |
          awk -F: '$1=="pub"{primary=1;next} primary && $1=="fpr"{print $10;primary=0}'
        )"
        test "$fingerprint" = "$CODECOV_GPG_FINGERPRINT"
        printf 'assert-signer %s\n' "$fingerprint" > "$GNUPGHOME/gpg.conf"
        printf '%s:6:\n' "$fingerprint" | gpg --batch --import-ownertrust
        gpg --batch --import "$key"
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        use_oidc: true
        slug: ${{ github.repository }}
        files: coverage.xml
        disable_search: true
        plugins: noop
        fail_ci_if_error: true
